server:
  port: 7091

spring:
  application:
    name: seata-server-${spring.profiles.active} # 服务名（与业务 seata.registry.nacos.application 一致）
  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
    allow-bean-definition-overriding: true # 允许 Bean 覆盖，例如说 Feign 等会存在重复定义的服务
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 172.18.92.41:8848 # 配置服务注册nacos地址
        namespace: ${spring.profiles.active} # 配置命名空间
        service: ${spring.application.name} # 配置服务名
      config:
        # 指定nacos server的地址
        server-addr: 172.18.92.41:8848
        # 配置文件后缀
        file-extension: yml
        # 命名空间 常用场景之一是不同环境的配置的区分隔离，例如开发测试环境和生产环境的资源（如配置、服务）隔离等
        namespace: ${spring.profiles.active} # 配置命名空间
        # 支持多个共享 Data Id 的配置，优先级小于ext-config,自定义 Data Id 配置 属性是个集合，内部由 Config POJO 组成。Config 有 3 个属性，分别是 dataId, group 以及 refresh
        ext-config:
          - data-id: skyeye-common.yml # 配置文件名-Data Id
            group: DEFAULT_GROUP # 默认为DEFAULT_GROUP
            refresh: false # 是否动态刷新，默认为false

logging:
  level:
    com.skyeye: debug
    io.seata: info

# Seata 控制台
console:
  user:
    username: seata
    password: seata

# Seata Server（TC）—— 全局会话库 store 只在这里配（不写 seataServer.yml）
# 库连接走 skyeye-common.yml 的 jdbc.database.*，只改 common 一处即可
seata:
  config:
    type: file
  registry:
    type: nacos
    nacos:
      application: ${spring.application.name}
      server-addr: ${spring.cloud.nacos.discovery.server-addr}
      namespace: ${spring.profiles.active}
      group: SEATA_GROUP
      cluster: default
  server:
    service-port: 8091
  store:
    mode: db
    session:
      mode: db
    lock:
      mode: db
    db:
      datasource: druid
      db-type: mysql
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 与 skyeye-common 中 jdbc.database 一致，只维护 common 一处
      url: ${jdbc.database.path}
      user: ${jdbc.database.username}
      password: ${jdbc.database.password}
      min-conn: 5
      max-conn: 30
      global-table: global_table
      branch-table: branch_table
      lock-table: lock_table
      distributed-lock-table: distributed_lock
  service:
    vgroup-mapping:
      skyeye_tx_group: default
    enable-degrade: false
    disable-global-transaction: false
