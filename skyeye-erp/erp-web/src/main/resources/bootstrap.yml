server:
  port: 8106

spring:
  application:
    name: skyeye-erp-${spring.profiles.active} # 服务名
  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
    allow-bean-definition-overriding: true # 允许 Bean 覆盖，例如说 Feign 等会存在重复定义的服务
  data:
    redis:
      repositories:
        enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 172.18.92.41:8848 # 配置服务注册nacos地址
        namespace: ${spring.profiles.active} # 配置命名空间
        service: ${spring.application.name} # 配置服务名
      config:
        # 指定nacos server的地址
        server-addr: 172.18.92.41:8848
        # 配置文件后缀
        file-extension: yml
        # 命名空间 常用场景之一是不同环境的配置的区分隔离，例如开发测试环境和生产环境的资源（如配置、服务）隔离等
        namespace: ${spring.profiles.active} # 配置命名空间
        # 支持多个共享 Data Id 的配置，优先级小于ext-config,自定义 Data Id 配置 属性是个集合，内部由 Config POJO 组成。Config 有 3 个属性，分别是 dataId, group 以及 refresh
        ext-config:
          - data-id: skyeye-common.yml # 配置文件名-Data Id
            group: DEFAULT_GROUP # 默认为DEFAULT_GROUP
            refresh: false # 是否动态刷新，默认为false
logging:
  level:
    com.skyeye: debug

topic:
  # ERP商品规格一物一码生成条形码的消息
  material-norms-code-generate-barcode: MATERIAL_NORMS_CODE_GENERATE_BARCODE
  # 设备维修单派工通知
  equipment-repair-dispatch-service: EQUIPMENT_REPAIR_DISPATCH_SERVICE
  # 设备巡检单派工通知
  equipment-inspection-dispatch-service: EQUIPMENT_INSPECTION_DISPATCH_SERVICE

webroot:
  # 项目相关的服务
  skyeye-project: skyeye-project-${spring.profiles.active}
  # 售后服务相关的服务
  skyeye-seal-service: skyeye-seal-service-${spring.profiles.active}
  # 门店相关的服务
  skyeye-shop: skyeye-shop-${spring.profiles.active}
  # 财政相关服务
  skyeye-ifs: skyeye-ifs-${spring.profiles.active}
  # 考勤相关服务
  skyeye-checkwork: skyeye-adm-${spring.profiles.active}

feign:
  client:
    config:
      # 全局配置
      default:
        loggerLevel: FULL


